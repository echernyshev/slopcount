[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopcount"
version = "0.1.0"
description = "Count the AI slop in your project and the cost of comprehending it. A loving sloccount parody."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Egor Chernyshev" }]
keywords = ["sloc", "sloccount", "ai", "llm", "slop", "parody", "cognitive-complexity"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Environment :: Console",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/echernyshev/slopcount"

[project.scripts]
slopcount = "slopcount.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
perplexity = ["transformers>=4.40", "torch>=2.2"]
treesitter = ["tree-sitter>=0.22", "tree-sitter-python>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/slopcount"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["tests/fixtures"]  # эталонный «слоп» — намеренно плохой код

[tool.ruff.lint]
# рекомендуемый прагматичный набор (дефолт ruff — только E4/E7/E9/F)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003", # «неоднозначные unicode» — ложные срабатывания на кириллице
]

[tool.ruff.format]

