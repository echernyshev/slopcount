[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopcount"
version = "0.1.0"
description = "Detect AI slop in a codebase and estimate the cost of comprehending it"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Egor Chernyshev" }]
dependencies = ["typer>=0.27,<0.28"]
keywords = ["sloc", "sloccount", "ai", "llm", "slop", "code-quality", "cocomo", "cognitive-complexity"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/echernyshev/slopcount"

[project.scripts]
slopcount = "slopcount.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
perplexity = ["transformers>=4.40", "torch>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/slopcount"]

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".serena"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = [
    "tests/fixtures",          # эталонный «слоп» — намеренно плохой код
    "docs/superpowers",        # снипеты в спеках/планах не являются кодом проекта
]

[tool.ruff.lint]
# рекомендуемый прагматичный набор (дефолт ruff — только E4/E7/E9/F)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003", # «неоднозначные unicode» — ложные срабатывания на кириллице
]

[tool.ruff.format]

